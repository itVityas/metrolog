
{% load static %}
{% load form_tags %}
<div class="modal-dialog modal-lg">
    <div class="modal-content form_content">
        <div class="modal-header">
            <h5 class="modal-title">ПАСПОРТНЫЕ ДАННЫЕ СИ</h5>
            <button type="button" class="close btn btn-dark" data-bs-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body">
        <form id="modal_form" action="" method="post">
            {% csrf_token %}
            <table>
                {% for field in form %}
                    <tr>
                        <th>
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        </th>
                        <td>
                            {{ field }}
                            {% if field|is_foreign_key %}
                                <a hx-get="{% url 'passport_'|add:field.name %}" hx-target="#handbooks_add_modal" hx-on::before-request="save_form(this)" hx-on::after-request="show_modal_in_passport(this, '{{'passport_'|add:field.name}}')">
                                    <img src="{% static 'img/plus-square-fill.svg' %}" fill="currentColor" alt="Добавить" width="24" height="24" />
                                </a>
                            {% endif %}
                        </td>
                        <td>
                            {% if field.errors %}
                                <div class="error-msg">{{ field.errors }}</div>
                            {% endif %}
                            {% if field.help_text %}
                                <p class="help-text">{{ field.help_text }}</p>
                            {% endif %}
                        </td>
                    </tr>
                {% endfor %}
            </table>
            <button class="btn btn-dark" type="submit">Сохранить</button>
            <button type="button" class="close btn btn-dark" data-bs-dismiss="modal" aria-label="Close">Отмена</button>
        </form>
        </div>
    </div>
</div>
