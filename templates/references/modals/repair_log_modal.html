<div id="repair_log_modal" class="modal fade" data-bs-keyboard="false" data-bs-backdrop="static" aria-hidden='true' tabindex='-1'>
    <div class="modal-dialog modal-lg">
        <div class="modal-content form_content">
            <div class="modal-header">
                <h5 class="modal-title">Введите</h5>
                <button type="button" class="close btn btn-dark" data-bs-dismiss="modal" aria-label="Close">
                  <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
            <form id="modal_form" action="{% url 'repair_log' %}" method="post">
                {% csrf_token %}
                <table>
                    <tr>
                        <th>
                            <label for="{{ form.start_date.id_for_label }}" class="form-label">{{ form.start_date.label }}</label>
                        </th>
                        <td>
                            {{ form.start_date }}
                        </td>
                    </tr>
                    <tr>
                        <th>
                            <label class="form-label">{{ form.change_type.label }}</label>
                        </th>
                        <td>
                        <div class="dropdown">
                            <button class="btn btn-outline-secondary dropdown-toggle text-start" type="button" id="multiSelectDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                Выберите варианты
                            </button>

                            <ul class="dropdown-menu w-auto p-3" aria-labelledby="multiSelectDropdown" style="max-height: 250px; overflow-y: auto;">
                                {% for choice in form.change_type %}
                                    <li class="form-check mb-2 text-nowrap">
                                        {{ choice.tag }}
                                        <label class="form-check-label" for="{{ choice.id_for_label }}">
                                            {{ choice.choice_label }}
                                        </label>
                                    </li>
                                {% endfor %}
                            </ul>
                        </div>
                        </td>
                    </tr>
                </table>
                <br>
                <button class="btn btn-dark" type="submit">Подтвердить</button>
                <button type="button" class="close btn btn-dark" data-bs-dismiss="modal" aria-label="Close">Отмена</button>
            </form>
            </div>
        </div>
    </div>
</div>
