<div id="modal_window_print" class="modal fade" aria-hidden='true' tabindex='-1'>
    <div class="modal-dialog modal-lg">
        <div class="modal-content form_content">
            <div class="modal-header">
                <h5 class="modal-title">Печать</h5>
                <button type="button" class="close btn btn-dark" data-bs-dismiss="modal" aria-label="Close">
                  <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                    <button class="btn btn-dark" type="button" id="print_to_pdf_button" onclick="print_to_pdf()" data="">pdf</button>
                    <button class="btn btn-dark" type="button" id="print_to_docx_button" onclick="print_to_word(this)" data="">{% csrf_token %}word</button>
                    <button class="btn btn-dark" type="button" id="print_to_docx_button" onclick="print_to_pdf2(this)" data="">{% csrf_token %}pdf2</button>
                    <button type="button" class="close btn btn-dark" data-bs-dismiss="modal" aria-label="Close">Отмена</button>
            </div>
        </div>
    </div>
</div>
